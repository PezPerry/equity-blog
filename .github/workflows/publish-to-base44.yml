name: Publish Article to Base44

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '!rns-news.html'
      - '!guidance-tracker.html'
      - '!tv-swipe.html'
      - '!financial-calendar*.html'
      - '!front-page.html'
      - '!index.html'
      - '!longreads/**'
      - '!trading-log/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Resolve the pushed commit range
        run: |
          # A push can carry several commits, and another push (the RNS/ONS pipeline is
          # busy) can land seconds later, so diffing HEAD~1..HEAD misses articles. Diff
          # the whole pushed range instead, falling back to the last commit when the
          # "before" commit is unknown (first push, force push) or not an ancestor.
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          RANGE="HEAD~1..HEAD"
          if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git cat-file -e "$AFTER^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
            RANGE="$BEFORE..$AFTER"
          fi
          echo "Detecting new articles over $RANGE"
          echo "RANGE=$RANGE" >> "$GITHUB_ENV"

      - name: Detect and publish new HTML articles
        env:
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
        run: |
          NEW_FILES=$(git diff --name-only --diff-filter=A "$RANGE" -- '*.html' ':!longreads/' ':!trading-log/' | grep -vE '^(rns-news|guidance-tracker|tv-swipe|financial-calendar[^/]*|front-page|index)\.html$' || true)

          if [ -z "$NEW_FILES" ]; then
            echo "No new HTML articles detected. Skipping."
            exit 0
          fi

          echo "$NEW_FILES" | while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            echo "========================================="
            echo "Processing: $FILE"

            export FILE

            python3 -c "
          import json, re, os
          from html import unescape

          filename = os.environ['FILE']
          slug = os.path.splitext(os.path.basename(filename))[0]
          github_url = f'https://pezperry.github.io/equity-blog/{filename}'

          with open(filename, 'r') as f:
              html = f.read()

          title_match = re.search(r'<title>([^|<]+)', html)
          # Page sources carry HTML entities (&mdash;, &amp;, &#8212;). Base44 stores
          # these fields as plain text, so decode them here - otherwise the entity
          # shows up literally in the title on the live site.
          title = unescape(title_match.group(1).strip()) if title_match else slug

          excerpt_match = re.search(r'meta name=\"description\" content=\"([^\"]+)\"', html)
          excerpt = unescape(excerpt_match.group(1)) if excerpt_match else ''

          kw_match = re.search(r'meta name=\"keywords\" content=\"([^\"]+)\"', html)
          keywords = kw_match.group(1).lower() if kw_match else ''

          # Secondary topic tags, kept alongside the single primary category so an
          # article can surface under cross-cutting filters (Banking, UK Markets)
          # without losing its Company Analysis home.
          raw_tags = [t.strip() for t in kw_match.group(1).split(',')] if kw_match else []
          tags, seen_tags = [], set()
          for t in raw_tags:
              if t and t.lower() not in seen_tags:
                  seen_tags.add(t.lower())
                  tags.append(t)

          text_only = re.sub(r'<[^>]+>', ' ', html)
          word_count = len(text_only.split())
          read_time = max(1, word_count // 200)

          all_text = f'{keywords} {title} {slug}'.lower()

          # A parenthesised uppercase ticker in the title - 'Greggs (GRG)', 'Barclays
          # (BARC)' - is the most reliable single-company signal we have, and it is
          # case-sensitive, so test it against the raw title rather than all_text.
          # Without this, a company note whose title carries no reporting keyword
          # ('Greggs (GRG) - Hold: Well Run, Fully Priced') falls through every
          # branch below and lands in the market_movements default.
          has_ticker = bool(re.search(r'\([A-Z]{2,5}\)', title))

          if has_ticker or re.search(r'(company.*(analysis|research)|earnings|results|rns|trading.update|annual.report|half.year|full.year|\bhy\s?20\d\d|\bfy\s?20\d\d|\bh[12]\s?20\d\d|interim)', all_text):
              category = 'company_analysis'
          elif re.search(r'(trade.*(log|diary|journal)|day.trade|swing.trade|position.*(open|close|sold|bought)|entry.price|stop.loss)', all_text):
              category = 'day_trades'
          elif re.search(r'(oil|crude|brent|wti|gold|silver|copper|commodit|energy.*(price|market)|opec|strait.*hormuz)', all_text):
              category = 'commodities'
          elif re.search(r'(nasdaq|ftse|s.p.500|dow.jones|index|indices|market.+(react|move|rebound|crash|rally))', all_text):
              category = 'indices'
          elif re.search(r'(market.*(movement|reaction|update|today)|sector|geopolit|tariff|sanction|blockade|war|conflict|defence)', all_text):
              category = 'market_movements'
          elif re.search(r'(hous(e|ing)|property|mortgage|homebuilder|construction|persimmon|barratt|bellway|taylor.wimpey|vistry)', all_text):
              category = 'housing'
          elif re.search(r'(inflation|cpi|consumer.price|cost.of.living|stagflation)', all_text):
              category = 'inflation'
          elif re.search(r'(interest.rate|base.rate|bank.of.england|federal.reserve|boe|fed.rate|monetary.policy)', all_text):
              category = 'interest_rates'
          elif re.search(r'(currency|forex|gbp|usd|eur|dollar|pound|exchange.rate)', all_text):
              category = 'currencies'
          else:
              category = 'market_movements'

          iframe = f'<div style=\"width:100%;margin:0;padding:0;\"><iframe src=\"{github_url}\" style=\"width:100%;height:85vh;border:none;display:block;\" scrolling=\"yes\"></iframe></div>'

          # Cover image: house convention is the article filename with a trailing
          # '-blog-page' dropped and '-cover.<ext>' appended, sitting beside the
          # article in the repo root. Only set it when the file actually exists,
          # so a missing cover leaves the field empty rather than pointing at a 404.
          cover_url = ''
          cover_stem = slug[:-len('-blog-page')] if slug.endswith('-blog-page') else slug
          for ext in ('png', 'jpg', 'jpeg'):
              candidate = f'{cover_stem}-cover.{ext}'
              if os.path.exists(candidate):
                  cover_url = f'https://pezperry.github.io/equity-blog/{candidate}'
                  break

          from datetime import date
          post = {
              'title': title,
              'slug': slug,
              'category': category,
              'tags': tags,
              'cover_image': cover_url,
              'content': iframe,
              'excerpt': excerpt,
              'author': 'Mickey Perry',
              'publish_date': date.today().isoformat(),
              'read_time': read_time,
              'is_published': True
          }

          print(f'  Title:    {title}')
          print(f'  Category: {category}')
          print(f'  Slug:     {slug}')
          print(f'  Read:     {read_time} min')
          print(f'  Cover:    {cover_url or \"(none found - add \" + cover_stem + \"-cover.png)\"}')

          with open('/tmp/base44_payload.json', 'w') as f:
              json.dump(post, f)
          "

            HTTP_CODE=$(curl -s -o /tmp/base44_response.json -w "%{http_code}" \
              -X POST \
              -H "api_key: ${BASE44_API_KEY}" \
              -H "Content-Type: application/json" \
              -d @/tmp/base44_payload.json \
              "https://perky-equity-insight-hub.base44.app/api/entities/BlogPost")

            if [ "$HTTP_CODE" = "200" ]; then
              POST_ID=$(python3 -c "import json; print(json.load(open('/tmp/base44_response.json')).get('id','?'))")
              CATEGORY=$(python3 -c "import json; print(json.load(open('/tmp/base44_response.json')).get('category','?'))")
              echo "  ✅ Published to Base44 (ID: $POST_ID, Category: $CATEGORY)"
            else
              echo "  ❌ Failed (HTTP $HTTP_CODE)"
              cat /tmp/base44_response.json
              exit 1
            fi
          done

      - name: Rotate the front page
        run: |
          NEW_FILES=$(git diff --name-only --diff-filter=A "$RANGE" -- '*.html' ':!longreads/' ':!trading-log/' | grep -vE '^(rns-news|guidance-tracker|tv-swipe|financial-calendar[^/]*|front-page|index)\.html$' || true)

          if [ -z "$NEW_FILES" ]; then
            echo "No new articles. Front page unchanged."
            exit 0
          fi

          TODAY=$(date -u +%F)
          echo "$NEW_FILES" | while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            echo "Adding $FILE to the front-page registry (date $TODAY)"
            python3 build-front-page.py --add "$FILE" --date "$TODAY"
            # Trading Log entries (tile-variant=trading-log) also go into the log index
            # and the front-page teaser; a no-op for every other article.
            python3 build-trading-log.py --add "$FILE"
          done

          if git diff --quiet -- front-page.html front-page-tiles.json trading-log/; then
            # New articles were found but nothing was registered: either the slug was
            # already in the registry or build-front-page.py held it off (cover missing).
            # Fail loudly so a skipped rotation is never a silent green run.
            echo "::warning::New article(s) detected but the front page did not change: $(echo "$NEW_FILES" | paste -sd ' ' -)"
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add front-page.html front-page-tiles.json trading-log/
          git commit -m "Front page: rotate tiles for new article(s)"

          # The RNS pipeline pushes to this repo often, so a plain push can lose a race.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Front page pushed."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - rebasing onto the remote and retrying."
            git pull --rebase
          done
          echo "Could not push the front page after 5 attempts."
          exit 1
